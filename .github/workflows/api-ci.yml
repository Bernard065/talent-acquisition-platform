name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  verify-api:
    name: Lint, type-check, and test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tap
          POSTGRES_USER: tap
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tap -d tap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_NAME: tap-api
      APP_VERSION: 0.1.0
      API_PREFIX: /api/v1
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://tap:test-password@localhost:5432/tap
      TEST_DATABASE_URL: postgresql+asyncpg://tap:test-password@localhost:5432/tap_test
      REDIS_URL: redis://localhost:6379/0
      JWT_ISSUER: https://issuer.example.test/
      JWT_AUDIENCE: talent-acquisition-api
      JWT_JWKS_URL: https://issuer.example.test/.well-known/jwks.json
      JWT_ALGORITHM: RS256
      JWT_LEEWAY_SECONDS: 30

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check dependency lock
        run: uv lock --check

      - name: Create test database
        working-directory: .
        env:
          PGPASSWORD: test-password
        run: psql -h localhost -U tap -d tap -c "CREATE DATABASE tap_test;"

      - name: Lint
        run: uv run ruff check app tests

      - name: Type-check
        run: uv run mypy app

      - name: Apply schema migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -q
