services:
  api:
    build:
      context: ./apps/api
    container_name: tap-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
    ports:
      - "8000:8000"
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    container_name: tap-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_data:/var/lib/clamav

  scanner-worker:
    build:
      context: ./apps/api
    container_name: tap-scanner-worker
    restart: unless-stopped
    command: python -m app.workers.document_scan_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    expose:
      - "9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.document_scan_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started

  candidate-privacy-worker:
    build:
      context: ./apps/api
    container_name: tap-candidate-privacy-worker
    restart: unless-stopped
    command: python -m app.workers.candidate_privacy_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.candidate_privacy_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  candidate-processor-deletion-worker:
    profiles:
      - privacy
    build:
      context: ./apps/api
    container_name: tap-candidate-processor-deletion-worker
    restart: unless-stopped
    command: python -m app.workers.candidate_processor_deletion_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CANDIDATE_PROCESSOR_DELETION_WORKER_ENABLED: ${CANDIDATE_PROCESSOR_DELETION_WORKER_ENABLED:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.candidate_processor_deletion_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  offer-expiry-worker:
    build:
      context: ./apps/api
    container_name: tap-offer-expiry-worker
    restart: unless-stopped
    command: python -m app.workers.offer_expiry_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.offer_expiry_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  job-posting-expiry-worker:
    build:
      context: ./apps/api
    container_name: tap-job-posting-expiry-worker
    restart: unless-stopped
    command: python -m app.workers.job_posting_expiry_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.job_posting_expiry_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  job-board-dispatch-worker:
    profiles:
      - job-boards
    build:
      context: ./apps/api
    container_name: tap-job-board-dispatch-worker
    restart: unless-stopped
    command: python -m app.workers.job_board_dispatch_worker
    env_file:
