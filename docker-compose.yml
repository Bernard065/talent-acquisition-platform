    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOB_BOARD_PROVIDER: local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.job_board_dispatch_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
