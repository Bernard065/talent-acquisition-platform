  notification-worker:
    build:
      context: ./apps/api
    container_name: tap-notification-worker
    restart: unless-stopped
    command: python -m app.workers.notification_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.notification_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  calendar-sync-worker:
    profiles:
      - calendar
    build:
      context: ./apps/api
    container_name: tap-calendar-sync-worker
    restart: unless-stopped
    command: python -m app.workers.calendar_sync_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.calendar_sync_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  hris-handoff-worker:
    profiles:
      - hris
    build:
      context: ./apps/api
    container_name: tap-hris-handoff-worker
    restart: unless-stopped
    command: python -m app.workers.hris_handoff_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HRIS_HANDOFF_PROVIDER: bamboohr
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.hris_handoff_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  webhook-delivery-worker:
    profiles:
      - webhooks
    build:
      context: ./apps/api
    container_name: tap-webhook-delivery-worker
    restart: unless-stopped
    command: python -m app.workers.webhook_delivery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.webhook_delivery_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  offer-signature-dispatch-worker:
    profiles:
      - signatures
    build:
      context: ./apps/api
    container_name: tap-offer-signature-dispatch-worker
    restart: unless-stopped
    command: python -m app.workers.offer_signature_dispatch_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OFFER_SIGNATURE_PROVIDER: local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.offer_signature_dispatch_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  offer-signature-expiry-worker:
    profiles:
      - signatures
    build:
      context: ./apps/api
    container_name: tap-offer-signature-expiry-worker
    restart: unless-stopped
    command: python -m app.workers.offer_signature_expiry_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.workers.offer_signature_expiry_worker_health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: tap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: tap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
