[project]

name = "tap-api"

version = "0.1.0"

description = "Talent Acquisition Platform API"

requires-python = ">=3.12,<3.13"

dependencies = [
  "alembic>=1.19.1",
  "asyncpg>=0.30,<1.0",
  "boto3>=1.35,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx2>=2.12.0",
  "prometheus-client>=0.22,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt[crypto]>=2.13.0",
  "redis>=5.2,<6.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]

dev = [
  "boto3-stubs[s3]>=1.35,<2.0",
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]

line-length = 100

target-version = "py312"

[tool.pytest.ini_options]

pythonpath = ["."]

addopts = "--import-mode=importlib"

asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"

[tool.pyright]

extraPaths = ["."]

[tool.ruff.lint]

select = ["E", "F", "I", "B", "UP", "S"]

ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]

"tests/**/*.py" = ["S101"]

[tool.mypy]

python_version = "3.12"

strict = true

warn_unreachable = true

warn_unused_ignores = true

[tool.pylint.main]

init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.messages_control]

disable = ["E1101"]
