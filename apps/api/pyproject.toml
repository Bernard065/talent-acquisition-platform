[project]

name = "tap-api"

version = "0.1.0"

description = "Talent Acquisition Platform API"

requires-python = ">=3.12,<3.13"

dependencies = [
  "alembic>=1.19.1",
  "asyncpg>=0.30,<1.0",
  "boto3>=1.35,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "infisicalsdk>=1.0.3,<2.0",
  "prometheus-client>=0.22,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pyjwt[crypto]>=2.13.0",
  "redis>=5.2,<6.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "structlog>=24.4,<27.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.28.1,<1.0",
  "opentelemetry-api>=1.37,<2.0",
  "opentelemetry-sdk>=1.37,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.58b0,<1.0",
]

[dependency-groups]

dev = [
  "boto3-stubs[s3]>=1.35,<2.0",
  "httpx2>=2.13.0",
  "mypy>=1.14,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.4.0,<2.0",
  "ruff>=0.16.5,<1.0",
]

[tool.ruff]

line-length = 100

target-version = "py312"

[tool.pytest.ini_options]

pythonpath = ["."]

addopts = "--import-mode=importlib"

asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"

[tool.pyright]

extraPaths = ["."]

[tool.ruff.lint]

select = ["E", "F", "I", "B", "UP", "S"]

ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]

"tests/**/*.py" = ["S101"]

[tool.mypy]

python_version = "3.12"

strict = true

warn_unreachable = true

warn_unused_ignores = true

[[tool.mypy.overrides]]

module = "boto3"

ignore_missing_imports = true

[tool.pylint.main]

init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.messages_control]

disable = ["E1101"]
